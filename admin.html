<!DOCTYPE html>
<html lang="uz"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TRENDIX Admin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f5f5f8;--card:#fff;--tx:#17171c;--mut:#8a8a99;--ac:#6c3df4;--ac2:#ff4d8d;--bd:#ececf2;--ok:#2f9e44}
@media(prefers-color-scheme:dark){:root{--bg:#0f0f14;--card:#1a1a22;--tx:#f2f2f7;--mut:#8f8fa3;--bd:#2a2a35}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:20px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px 0}
.logo{font-weight:900;font-size:20px;letter-spacing:2px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;color:transparent}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0}
.tab{flex:none;padding:8px 12px;border-radius:18px;background:var(--card);border:1px solid var(--bd);font-size:13px;white-space:nowrap}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{padding:0 12px}
h3{margin:12px 0 8px;font-size:16px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.k b{display:block;font-size:17px;margin-top:2px}
.mut{color:var(--mut);font-size:12px}
.row{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px;font-size:13px}
.flex{display:flex;align-items:center;gap:10px}.grow{flex:1}
.th{width:46px;height:46px;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:28px;background:var(--bg);flex:none}
.th img{width:100%;height:100%;object-fit:cover}
.btn{padding:11px 14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:700;font-size:14px}
.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn.red{background:#e03131}
.btn.sm{padding:6px 10px;font-size:12px}.full{width:100%;margin-top:8px}
input.f,select.f,textarea.f{width:100%;padding:10px;margin:4px 0;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px;font-family:inherit}
.bar{display:flex;align-items:flex-end;gap:5px;height:90px;margin:8px 0}
.bar div{flex:1;background:linear-gradient(var(--ac),var(--ac2));border-radius:5px 5px 0 0;min-height:2px}
.sheet{position:fixed;inset:0;background:#0008;z-index:20;display:none;align-items:flex-end}.sheet.show{display:flex}
.box{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.empty{text-align:center;color:var(--mut);padding:30px 0}
.tag{display:inline-block;padding:2px 8px;border-radius:8px;background:var(--bg);font-size:11px;margin-left:4px}
.row,.k{box-shadow:0 3px 10px #0000001a;animation:up .35s both}
.btn{box-shadow:0 5px 14px #6c3df455;transition:transform .12s}.btn:active{transform:scale(.96)}.btn.alt,.btn.red{box-shadow:none}
.tab{transition:all .2s}.tab:active{transform:scale(.93)}.tab.on{box-shadow:0 4px 12px #6c3df466}
.sheet.show{animation:fade .25s}.sheet.show .box{animation:slide .3s cubic-bezier(.2,.8,.2,1)}
.bar div{animation:grow .7s cubic-bezier(.2,.8,.2,1) both;transform-origin:bottom}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes slide{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<header><div class="logo">TRENDIX · ADMIN</div><div class="tabs" id="tabs"></div></header>
<main id="main"><div class="empty">Yuklanmoqda...</div></main>
<div class="sheet" id="sheet"><div class="box" id="box"></div></div>
<script>
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand()}
const CATS=["Erkaklar kiyimi","Ayollar kiyimi","Bolalar kiyimi","Oyoq kiyim","Elektronika","Telefon aksessuarlari","Maishiy texnika","Oziq-ovqat","Kosmetika","Uy-ro'zg'or","Sport","Boshqa"];
const $=id=>document.getElementById(id);
const m=n=>Number(n).toLocaleString("ru-RU")+" so'm";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const qs=new URLSearchParams(location.search);
let API=qs.get("api")||"";try{if(API)localStorage.setItem("tx_api",API);else API=localStorage.getItem("tx_api")||""}catch{}
const INIT=(tg&&tg.initData)||"";
async function api(path,body){
 if(!API)throw new Error("Server manzili yo'q. Botda /admin bosing.");
 const r=await fetch(API+path,{method:body?"POST":"GET",headers:{"Content-Type":"application/json","X-Init-Data":INIT},body:body?JSON.stringify(body):undefined});
 let j={};try{j=await r.json()}catch{}
 if(!r.ok)throw new Error(j.error||("Xatolik "+r.status));return j}
let D=null,tab="stats",flt="Hammasi",cur={};
const TABS=[["stats","📊 Statistika"],["orders","🧾 Buyurtmalar"],["products","📦 Mahsulotlar"],["promos","🏷 Promo-kodlar"],["banners","🖼 Bannerlar"],["customers","👥 Mijozlar"]];
async function load(){try{D=await api("/api/admin/data");render()}catch(e){$("main").innerHTML=`<div class="empty">⛔ ${esc(e.message)}<br><br>Botda /admin bosib qayta oching.</div>`}}
function go(t){tab=t;render();window.scrollTo(0,0)}
function render(){
 $("tabs").innerHTML=TABS.map(t=>`<div class="tab ${tab===t[0]?"on":""}" onclick="go('${t[0]}')">${t[1]}</div>`).join("");
 $("main").innerHTML=({stats:vStats,orders:vOrders,products:vProducts,promos:vPromos,banners:vBanners,customers:vCustomers})[tab]();
}
function vStats(){const s=D.stats,mx=Math.max(1,...s.days.map(d=>d.sum));
 return `<div class="kpi"><div class="k"><span class="mut">Jami buyurtma</span><b>${s.orders}</b></div><div class="k"><span class="mut">Bugun</span><b>${s.today}</b></div>
 <div class="k"><span class="mut">Daromad (yetkazilgan)</span><b>${m(s.revenue)}</b></div><div class="k"><span class="mut">Jarayondagi summa</span><b>${m(s.pending)}</b></div>
 <div class="k"><span class="mut">Mijozlar</span><b>${s.customers}</b></div><div class="k"><span class="mut">Mahsulotlar</span><b>${D.products.length}</b></div></div>
 <h3>Oxirgi 7 kun savdosi</h3><div class="row"><div class="bar">${s.days.map(d=>`<div style="height:${Math.round(d.sum/mx*100)}%" title="${m(d.sum)}"></div>`).join("")}</div>
 <div class="flex mut" style="justify-content:space-between">${s.days.map(d=>`<span>${d.d}</span>`).join("")}</div></div>
 <h3>Holatlar bo'yicha</h3><div class="row">${D.statuses.map(x=>`<div class="flex"><span class="grow">${x}</span><b>${s.byStatus[x]}</b></div>`).join("")}</div>
 <h3>Eng ko'p sotilgan</h3><div class="row">${s.top.length?s.top.map(t=>`<div class="flex"><span class="grow">${esc(t[0])}</span><b>${t[1]} dona</b></div>`).join(""):"Hali sotuv yo'q"}</div>`}
function vOrders(){const l=D.orders.filter(o=>flt==="Hammasi"||o.status===flt);
 return `<div class="tabs">${["Hammasi",...D.statuses].map(x=>`<div class="tab ${flt===x?"on":""}" onclick="flt='${x.replace(/'/g,"\\'")}';render()">${x}</div>`).join("")}</div>`+
 (l.length?l.map(o=>`<div class="row"><b>#${esc(o.id)}</b> · ${esc(o.date)} <span class="tag">${esc(o.pay)}</span><br>
 👤 ${esc(o.name)} · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a>${o.uname?" · @"+esc(o.uname):""}<br>📍 ${esc(o.region)}, ${esc(o.address)}<br>
 ${o.items.map(i=>`• ${esc(i.name)} ${esc(i.size)} ${esc(i.color)} ×${i.qty}`).join("<br>")}<br>
 ${o.promo?`Promo: ${esc(o.promo)} (−${m(o.discount)})<br>`:""}Yetkazish: ${o.delivery?m(o.delivery):"Bepul"}<br><b>Jami: ${m(o.total)}</b>
 <select class="f" onchange="setSt('${esc(o.id)}',this.value)" ${o.status==="Bekor qilindi"?"disabled":""}>${D.statuses.map(x=>`<option ${x===o.status?"selected":""}>${x}</option>`).join("")}</select></div>`).join(""):`<div class="empty">Buyurtma yo'q</div>`)}
async function setSt(id,status){if(status==="Bekor qilindi"&&!confirm("Buyurtma bekor qilinsinmi? Mahsulotlar omborga qaytadi."))return load();
 try{await api("/api/admin/order-status",{id,status});await load()}catch(e){alert(e.message);load()}}
function vProducts(){return `<button class="btn full" onclick="editP()">+ Mahsulot qo'shish</button><div style="height:10px"></div>`+
 D.products.map(p=>`<div class="row flex"><div class="th">${p.img?`<img src="${esc(p.img)}">`:esc(p.emoji)}</div><div class="grow"><b>${esc(p.name)}</b>${p.active?"":'<span class="tag">yashirin</span>'}<br><span class="mut">${CATS[p.cat]} · ${m(p.price)}${p.old?" (eski "+m(p.old)+")":""} · ombor: ${p.stock}</span></div>
 <button class="btn alt sm" onclick="editP(${p.id})">✏️</button><button class="btn red sm" onclick="del('products',${p.id})">🗑</button></div>`).join("")}
function editP(id){cur=id?{...D.products.find(p=>p.id===id)}:{active:true,rating:4.5,emoji:"📦",cat:0,sizes:[],colors:[]};
 $("box").innerHTML=`<h3>${id?"Mahsulotni tahrirlash":"Yangi mahsulot"}</h3>
 <input class="f" id="fn" placeholder="Nomi" value="${esc(cur.name)}">
 <select class="f" id="fc">${CATS.map((c,i)=>`<option value="${i}" ${i===cur.cat?"selected":""}>${c}</option>`).join("")}</select>
 <input class="f" id="fp" type="number" placeholder="Narxi (so'm)" value="${cur.price??""}">
 <input class="f" id="fo" type="number" placeholder="Eski narx (chegirma uchun, ixtiyoriy)" value="${cur.old||""}">
 <input class="f" id="fs" type="number" placeholder="Ombordagi soni" value="${cur.stock??""}">
 <input class="f" id="fe" placeholder="Emoji (rasm bo'lmasa)" value="${esc(cur.emoji)}">
 <div class="flex"><div class="th" id="prev">${cur.img?`<img src="${esc(cur.img)}">`:esc(cur.emoji)}</div><input type="file" accept="image/*" onchange="pickImg(this)"></div>
 <input class="f" id="fz" placeholder="O'lchamlar: S,M,L" value="${esc((cur.sizes||[]).join(","))}">
 <input class="f" id="fl" placeholder="Ranglar: Oq,Qora" value="${esc((cur.colors||[]).join(","))}">
 <textarea class="f" id="fd" rows="3" placeholder="Tavsif">${esc(cur.desc)}</textarea>
 <label><input type="checkbox" id="fa" ${cur.active?"checked":""}> Sotuvda ko'rinsin</label>
 <button class="btn full" onclick="saveP()">💾 Saqlash</button><button class="btn alt full" onclick="closeS()">Bekor qilish</button>`;
 $("sheet").classList.add("show")}
function pickImg(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
 const s=Math.min(1,600/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
 c.getContext("2d").drawImage(im,0,0,c.width,c.height);cur.img=c.toDataURL("image/jpeg",.72);$("prev").innerHTML=`<img src="${cur.img}">`};im.src=r.result};r.readAsDataURL(f)}
const csv=v=>v.split(",").map(x=>x.trim()).filter(Boolean);
async function saveP(){
 const item={id:cur.id,name:$("fn").value,cat:+$("fc").value,price:+$("fp").value,old:+$("fo").value||0,stock:+$("fs").value||0,emoji:$("fe").value||"📦",img:cur.img||"",sizes:csv($("fz").value),colors:csv($("fl").value),desc:$("fd").value,active:$("fa").checked,rating:cur.rating||4.5};
 if(!item.name.trim())return alert("Nomini kiriting");if(!(item.price>0))return alert("Narxni kiriting");
 await saveItem("products",item)}
async function saveItem(type,item){try{await api("/api/admin/save",{type,item});closeS();await load()}catch(e){alert(e.message)}}
async function del(type,id){if(!confirm("O'chirilsinmi?"))return;try{await api("/api/admin/delete",{type,id});await load()}catch(e){alert(e.message)}}
function vPromos(){return `<button class="btn full" onclick="editPromo()">+ Promo-kod qo'shish</button><div style="height:10px"></div>`+
 D.promos.map(p=>`<div class="row flex"><div class="grow"><b>${esc(p.code)}</b> · −${p.percent}% ${p.active?"":'<span class="tag">o\'chiq</span>'}</div>
 <button class="btn alt sm" onclick="editPromo('${esc(p.code)}')">✏️</button><button class="btn red sm" onclick="del('promos','${esc(p.code)}')">🗑</button></div>`).join("")}
function editPromo(code){const p=code?D.promos.find(x=>x.code===code):{code:"",percent:10,active:true};
 $("box").innerHTML=`<h3>Promo-kod</h3><input class="f" id="pcode" placeholder="KOD (lotin harf/raqam)" value="${esc(p.code)}" ${code?"readonly":""}>
 <input class="f" id="ppc" type="number" placeholder="Chegirma foizi (1-90)" value="${p.percent}">
 <label><input type="checkbox" id="pa" ${p.active?"checked":""}> Faol</label>
 <button class="btn full" onclick="saveItem('promos',{code:$('pcode').value,percent:+$('ppc').value,active:$('pa').checked})">💾 Saqlash</button><button class="btn alt full" onclick="closeS()">Bekor qilish</button>`;
 $("sheet").classList.add("show")}
function vBanners(){return `<button class="btn full" onclick="editB()">+ Banner qo'shish</button><div style="height:10px"></div>`+
 D.banners.map(b=>`<div class="row flex"><div class="grow"><b>${esc(b.title)}</b>${b.active?"":'<span class="tag">yashirin</span>'}<br><span class="mut">${esc(b.text)}</span></div>
 <button class="btn alt sm" onclick="editB(${b.id})">✏️</button><button class="btn red sm" onclick="del('banners',${b.id})">🗑</button></div>`).join("")}
function editB(id){const b=id?D.banners.find(x=>x.id===id):{title:"",text:"",active:true};
 $("box").innerHTML=`<h3>Banner</h3><input class="f" id="bt" placeholder="Sarlavha" value="${esc(b.title)}"><input class="f" id="bx" placeholder="Matn" value="${esc(b.text)}">
 <label><input type="checkbox" id="ba" ${b.active?"checked":""}> Ko'rinsin</label>
 <button class="btn full" onclick="saveItem('banners',{id:${id||0},title:$('bt').value,text:$('bx').value,active:$('ba').checked})">💾 Saqlash</button><button class="btn alt full" onclick="closeS()">Bekor qilish</button>`;
 $("sheet").classList.add("show")}
function vCustomers(){return D.customers.length?D.customers.map(c=>`<div class="row"><b>${esc(c.name)}</b>${c.username?" · @"+esc(c.username):""}<br><a href="tel:${esc(c.phone)}">${esc(c.phone)}</a><br><span class="mut">Buyurtmalar: ${c.orders} · Xarid: ${m(c.spent)} · Birinchi: ${esc(c.first)}</span></div>`).join(""):`<div class="empty">Mijozlar hali yo'q</div>`}
function closeS(){$("sheet").classList.remove("show")}
$("sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closeS()});
load();
</script></body></html>
